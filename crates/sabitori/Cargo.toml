[package]
name = "sabitori"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# 既定は日本語込み。sabitori で書く UI はまず日本語を出すので、Latin だけの
# 組み込みは「日本語を描かないアプリ」に最適化した既定になってしまう。
default = ["builtin-font-jp"]

# wasm32 ビルドに最終フォールバックのフォントを埋め込む。native のビルドには
# バイト 1 つ入らない。詳細は `sabitori-text` の `BUILTIN_FONT`。
#
#   sabitori = "0.5"
#       → HackGen (日本語込み) 10.2MB / gzip 4.9MB。`fonts()` を書かなくても
#         日本語がそのまま出る。
#
#   sabitori = { version = "0.5", default-features = false,
#                features = ["builtin-font-latin"] }
#       → Hack (Latin と罫線素片のみ) 302KB / gzip 144KB。日本語は豆腐になる。
#
#   sabitori = { version = "0.5", default-features = false }
#       → 組み込み無し。`fonts()` を書き忘れると、書き方を出して停止する。
builtin-font-jp = ["sabitori-text/builtin-font-jp"]
builtin-font-latin = ["sabitori-text/builtin-font-latin"]

# Rust コードのホットリロード (dev 専用)。`dx serve --hotpatch` と組で使う。
# subsecond は debug_assertions が有効なときだけ働くので、有効にしたまま release を
# 出しても実行時コストは無いが、依存を持ち込まないよう既定では off。
hot-reload = ["dep:subsecond", "dep:dioxus-cli-config", "dep:tungstenite", "dep:serde_json"]

[dependencies]
sabitori-core.workspace = true
sabitori-gpu.workspace = true
sabitori-style.workspace = true
sabitori-layout.workspace = true
sabitori-anim.workspace = true
sabitori-widgets.workspace = true
sabitori-text.workspace = true
sabitori-scene.workspace = true
sabitori-input.workspace = true
sabitori-window.workspace = true
sabitori-net.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true }
winit.workspace = true
web-time.workspace = true
log.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
# ホットリロード (feature = "hot-reload")。パッチを作るのは `dx` CLI 側で、ここに
# あるのは走っているプロセスが受け取る口だけ。上流の dioxus-devtools を使うと
# VirtualDom 用の dioxus-core / dioxus-signals まで付いてくるので、必要な受信処理
# (40 行) は crates/sabitori/src/hot_reload.rs に自前で持つ。
subsecond = { version = "0.7", optional = true }
dioxus-cli-config = { version = "0.7", optional = true }
tungstenite = { version = "0.28", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
console_error_panic_hook.workspace = true
console_log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true }
objc2-ui-kit = { workspace = true }

# wgpu is only needed by SceneApp examples (custom render_scene passes).
# sabitori-markdown drives the live-render demo in the sabitori_home example.
[dev-dependencies]
wgpu.workspace = true
sabitori-markdown.workspace = true
pollster.workspace = true
bytemuck.workspace = true

