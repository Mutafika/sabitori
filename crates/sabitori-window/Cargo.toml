[package]
name = "sabitori-window"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Android: どちらの Activity に載せるか。winit (android-activity) は**ちょうど
# 1 つ**を要求する (0 でも 2 でもコンパイルエラー)。
#
#   android-native-activity  Java のコードが要らない。ソフトキーボードは英数の
#                            キー入力としてしか届かない (かな漢字変換は不可)。
#   android-game-activity    Gradle で `androidx.games:games-activity` を入れる。
#                            IME の文字列が取れるので日本語が打てる。
android-native-activity = ["winit/android-native-activity"]
android-game-activity = ["winit/android-game-activity"]

[dependencies]
sabitori-core.workspace = true
sabitori-gpu.workspace = true
sabitori-scene.workspace = true
sabitori-input.workspace = true
wgpu.workspace = true
winit.workspace = true
tracing.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
tracing-subscriber = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Document",
    "DomRect",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "Performance",
] }
console_error_panic_hook.workspace = true
console_log.workspace = true
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
