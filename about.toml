# self_cell declares "Apache-2.0 OR GPL-2.0" but uses the deprecated
# SPDX identifier `GPL-2.0` (should be `GPL-2.0-only`), which cargo-about
# refuses to parse. We force Apache-2.0 to sidestep the deprecated id.
[self_cell.clarify]
license = "Apache-2.0"
[[self_cell.clarify.files]]
path = "LICENSE-APACHE"
checksum = "c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4"
