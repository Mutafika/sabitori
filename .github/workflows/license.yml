# ライセンス周りが黙って壊れるのを止める。
#
# 実際に起きたこと: v0.4.0 で arboard が入り、その依存の BSL-1.0 が deny.toml の
# allow に無かったため `cargo deny check licenses` が赤くなった。誰も回していな
# かったので v0.7.0 まで 4 マイナー分気付かれず、同じ期間 THIRD-PARTY-LICENSES.html
# も再生成されないまま、arboard (MIT/Apache-2.0) の帰属が抜けた状態で放置された。
#
# どちらも「依存を足した PR がその場で赤くなる」ようにすれば起きない。
name: license

on:
  push:
    branches: [main]
  pull_request:
  # 依存を触っていなくても、新しい RUSTSEC 勧告や cargo-deny の更新で
  # 状況は変わる。週 1 で気付けるようにしておく。
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # deny と about は起動のたびにビルドすると数分かかる。バイナリを取る。
      #
      # **バージョンは固定する。** cargo-about の出力はコミット済みの
      # THIRD-PARTY-LICENSES.html と 1 バイト単位で比べるので、`@latest` にすると
      # 依存が何も変わっていなくても、ツールが新版を出した日に落ちる。実際 0.8.4 で
      # 生成したファイルを 0.9.2 が検査して落ちた (0.9.2 は 178 → 201 エントリと
      # 拾う範囲が広い)。それは「誰も読まないゲート」への最短路なので固定する。
      #
      # 上げるときは、同じバージョンで再生成したファイルを同じ PR に入れること。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      # allow リストに無いライセンスが混ざっていないこと。
      # `--all-features` は hot-reload の依存 (subsecond / tungstenite ほか) も
      # 検査対象に入れるため — 既定 off でも、有効にした利用者には効いてくる。
      - name: cargo deny check licenses
        run: cargo deny --all-features check licenses

      # 配布物の帰属表示に、現在の依存が漏れなく載っていること。
      #
      # 比べるのは**クレート名の集合だけ**で、バージョンは落とす。
      # THIRD-PARTY-LICENSES.html は正確なバージョン番号を埋め込むが、
      # Cargo.lock は追跡していない (ライブラリなので) ため、CI は毎回まっさらに
      # 解決して最新の patch を拾う。バージョンまで比べると、リポジトリに何の変更が
      # 無くても上流が publish しただけで赤くなる — 誰も直しようがない赤は、
      # この workflow が防ごうとしているものそのもの。
      #
      # 名前の集合なら「依存を足したのに再生成していない」だけを捕まえられる。
      # 実際に起きたのはそれ (v0.4.0 の arboard)。
      #
      # 正確なバージョンはリリース時に揃える — RELEASING.md の工程に入れてある。
      - name: 帰属ファイルに現在の依存が載っているか
        run: |
          names() {
            grep -oE '<li><a href="[^"]*">[^<]+ [0-9][^<]*</a></li>' "$1" \
              | sed -E 's/.*">//; s/ [0-9][^<]*<\/a><\/li>$//' | sort -u
          }
          cargo about generate about.hbs -o /tmp/third-party.html --all-features
          if ! diff -u <(names THIRD-PARTY-LICENSES.html) <(names /tmp/third-party.html) > /tmp/names.diff; then
            echo "::error::THIRD-PARTY-LICENSES.html に載っていない依存があります (または消えた依存が残っています)。"
            echo "::error::次を実行してコミットしてください (cargo-about は 0.9.2):"
            echo "::error::  cargo install cargo-about --version 0.9.2 --locked"
            echo "::error::  cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html --all-features"
            echo "--- 差分 (- が欠落、+ が余分) ---"
            cat /tmp/names.diff
            exit 1
          fi
          echo "帰属済みクレート: $(names THIRD-PARTY-LICENSES.html | wc -l) 件"
