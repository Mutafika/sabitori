# allow に無いライセンスが依存ツリーに入ったら止める。
#
# 実際に起きたこと: v0.4.0 で arboard が入り、その依存の BSL-1.0 が deny.toml の
# allow に無かったため `cargo deny check licenses` が赤くなった。CI が無く誰も
# 回していなかったので、v0.7.0 まで 4 マイナー分気付かれなかった。
#
# THIRD-PARTY-LICENSES.html の鮮度はここでは見ない。あのファイルは依存の正確な
# バージョンを埋め込むが、Cargo.lock を追跡していない (ライブラリなので) ため
# CI は毎回まっさらに解決する。上流が patch を出すたびにバージョンが動き、
# 推移依存のクレート自体も増減するので、何を比べても定期的に赤くなる。
# 誰も直しようがない赤は、この workflow が防ごうとしているものそのもの。
#
# 代わりに RELEASING.md の工程 4 で、リリースごとに再生成する。配布物に載る
# 内容が正しければよく、その瞬間はリリース時。
#
# CI でも見たいなら Cargo.lock を追跡する必要がある (未決)。
name: license

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # deny と about は起動のたびにビルドすると数分かかる。バイナリを取る。
      #
      # **バージョンは固定する。** cargo-about の出力はコミット済みの
      # THIRD-PARTY-LICENSES.html と 1 バイト単位で比べるので、`@latest` にすると
      # 依存が何も変わっていなくても、ツールが新版を出した日に落ちる。実際 0.8.4 で
      # 生成したファイルを 0.9.2 が検査して落ちた (0.9.2 は 178 → 201 エントリと
      # 拾う範囲が広い)。それは「誰も読まないゲート」への最短路なので固定する。
      #
      # 上げるときは、同じバージョンで再生成したファイルを同じ PR に入れること。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      # allow リストに無いライセンスが混ざっていないこと。
      # `--all-features` は hot-reload の依存 (subsecond / tungstenite ほか) も
      # 検査対象に入れるため — 既定 off でも、有効にした利用者には効いてくる。
      - name: cargo deny check licenses
        run: cargo deny --all-features check licenses
