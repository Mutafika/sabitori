# allow に無いライセンスが依存ツリーに入ったら止める。
#
# 実際に起きたこと: v0.4.0 で arboard が入り、その依存の BSL-1.0 が deny.toml の
# allow に無かったため `cargo deny check licenses` が赤くなった。CI が無く誰も
# 回していなかったので、v0.7.0 まで 4 マイナー分気付かれなかった。
#
# THIRD-PARTY-LICENSES.html の鮮度もここで見る。あのファイルは依存の正確な
# バージョンを埋め込むので、CI と手元で同じツリーを解決できないと比較にならない。
# そのために Cargo.lock を追跡し、全コマンドに --locked を付けている。
# --locked を外すと CI が勝手に解決し直し、上流が patch を出しただけで
# 赤くなる — 一度そうなった。
name: license

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # deny と about は起動のたびにビルドすると数分かかる。バイナリを取る。
      #
      # **バージョンは固定する。** cargo-about の出力はコミット済みの
      # THIRD-PARTY-LICENSES.html と 1 バイト単位で比べるので、`@latest` にすると
      # 依存が何も変わっていなくても、ツールが新版を出した日に落ちる。実際 0.8.4 で
      # 生成したファイルを 0.9.2 が検査して落ちた (0.9.2 は 178 → 201 エントリと
      # 拾う範囲が広い)。それは「誰も読まないゲート」への最短路なので固定する。
      #
      # 上げるときは、同じバージョンで再生成したファイルを同じ PR に入れること。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      # allow リストに無いライセンスが混ざっていないこと。
      # `--all-features` は hot-reload の依存 (subsecond / tungstenite ほか) も
      # 検査対象に入れるため — 既定 off でも、有効にした利用者には効いてくる。
      - name: cargo deny check licenses
        run: cargo deny --all-features --locked check licenses

      # 配布物の帰属表示が、現在の依存ツリーと一致していること。
      #
      # MIT と Apache-2.0 は配布物に著作権表示を含めることを要求していて、その
      # 義務を実際に果たしているのがこのファイル。v0.3.13 から v0.7.0 まで
      # 再生成されず、arboard ほか 5 本の帰属が抜けたまま 4 マイナー分配られた。
      #
      # Cargo.lock を追跡し、ツールを固定し、--locked を付けているので、
      # 出力は CI でも手元でも同じになる (ホスト OS にも依存しない)。
      - name: 帰属ファイルが依存ツリーと一致しているか
        run: |
          cargo about generate about.hbs -o /tmp/third-party.html --all-features --locked
          if ! diff -q THIRD-PARTY-LICENSES.html /tmp/third-party.html > /dev/null; then
            echo "::error::THIRD-PARTY-LICENSES.html が依存ツリーとずれています。"
            echo "::error::次を実行してコミットしてください:"
            echo "::error::  cargo install cargo-about --version 0.9.2 --locked"
            echo "::error::  cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html --all-features --locked"
            diff -u THIRD-PARTY-LICENSES.html /tmp/third-party.html | head -40
            exit 1
          fi
